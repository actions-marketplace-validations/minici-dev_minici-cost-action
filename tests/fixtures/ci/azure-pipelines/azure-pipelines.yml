trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    jobs:
      - job: Lint
        timeoutInMinutes: 10
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: npm ci
          - script: npm run lint

      - job: Test
        timeoutInMinutes: 30
        strategy:
          matrix:
            node18:
              nodeVersion: '18.x'
            node20:
              nodeVersion: '20.x'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: npm ci
          - script: npm test -- --coverage
          - task: PublishTestResults@2
            inputs:
              testResultsFiles: 'reports/junit.xml'

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: Build
        timeoutInMinutes: 20
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: npm ci
          - script: npm run build
          - publish: dist
            artifact: web
