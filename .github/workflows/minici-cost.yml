name: MiniCI Pull Request Cost Receipt
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write
jobs:
  ci-cost-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run MiniCI Cost & Matrix Diff (Always Exits 0)
        uses: minici-dev/minici-cost-action@v1
        with:
          tier: auto
          prs-per-week: 25
          pushes-per-pr: 4
          dev-hourly-rate: 65
