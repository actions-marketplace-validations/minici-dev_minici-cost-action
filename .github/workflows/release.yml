name: Release & Tag Multi-Arch Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and publish (e.g. v0.9.1)"
        required: true
        default: "v0.9.1"

permissions:
  contents: write

jobs:
  verify-gates:
    name: Closed-Loop QA & 0% Catalog Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust Unit & CLI Contract Lock Suite
        run: cargo test --manifest-path crates/minici/Cargo.toml
      - name: Verify Canonical SKU Catalog 0.00% Drift
        run: |
          cargo build --release --manifest-path crates/minici/Cargo.toml
          python3 tools/sync_rust_sku_catalog.py --check --bin crates/minici/target/release/minici

  build-matrix:
    name: Build ${{ matrix.artifact }}
    needs: verify-gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: minici-linux-x86_64
            bin_name: minici
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: minici-linux-aarch64
            bin_name: minici
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: minici-macos-aarch64
            bin_name: minici
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: minici-macos-x86_64
            bin_name: minici
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: minici-windows-x86_64.exe
            bin_name: minici.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - name: Build Zero-Dependency Release Binary
        run: cargo build --release --manifest-path crates/minici/Cargo.toml --target ${{ matrix.target }}
      - name: Stage Release Binary & Smoke-Test Version
        shell: bash
        run: |
          mkdir -p dist
          cp "crates/minici/target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7

  publish-release:
    name: Publish GitHub Release, SHA256SUMS & Floating @v1 Tag
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          chmod +x minici-linux-* minici-macos-* || true
          sha256sum minici-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release & Update Floating v1 Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="${{ inputs.tag }}"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --title "MiniCI $TAG_NAME — Dynamic FinOps, 24 Models, 8-Tool MCP, Jev /v1/systemone & 7 CI Platforms" \
              --generate-notes
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa v1 -m "Update floating @v1 action tag to $TAG_NAME"
          git push origin v1 --force
