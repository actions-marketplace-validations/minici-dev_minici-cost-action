name: MiniCI Sticky PR Cost Receipt & @minici Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: minici-pr-bot-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  minici-receipt:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       !contains(github.event.comment.body, '<!-- minici-') &&
       contains(github.event.comment.body, '@minici') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run MiniCI Sticky PR Diff or @minici Command Router
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINICI_REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF_DEFAULT: ${{ github.base_ref }}
        run: |
          BIN_DIR="$(mktemp -d)"
          trap 'rm -rf "$BIN_DIR"' EXIT
          BIN="$BIN_DIR/bin/minici"
          if [ -f "crates/minici/Cargo.toml" ]; then
            cargo build --locked --release --manifest-path crates/minici/Cargo.toml
            mkdir -p "$BIN_DIR/bin"
            cp crates/minici/target/release/minici "$BIN"
          else
            cargo install --locked --git https://github.com/minici-dev/minici-cost-action.git \
              --rev 5c2152f912efcfaf89f82d6cbee3b0dd455a2bba --root "$BIN_DIR" minici
          fi
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            GH_API="${GITHUB_API_URL:-https://api.github.com}"
            GH_API="${GH_API%/}"
            PR_JSON="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${GH_API}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            BASE_REF="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get("base",{}).get("ref","main"))' <<< "$PR_JSON")"
            git fetch origin "refs/pull/${PR_NUMBER}/head:minici-pr-head" "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            git checkout minici-pr-head
            "$BIN" comment github \
              --path . \
              --compare-to "origin/${BASE_REF}" \
              --pr "$PR_NUMBER" \
              --event-path "$GITHUB_EVENT_PATH" \
              --behavior new \
              --post
          else
            "$BIN" comment github \
              --path . \
              --compare-to "origin/${BASE_REF_DEFAULT}" \
              --pr "$PR_NUMBER" \
              --behavior update \
              --suggest-fixes \
              --post
          fi
